<ng-container *ngIf="(useTotal ? layerFeaturesTotalCount$ : layerFeaturesCount$) | async as layerFeaturesCount">
  <div>
    <ng-container *ngIf="layerFeaturesCount[layerId]?.tracks as countEcTracks">
      <div
        *ngIf="countEcTracks > 0"
      >
        <span>{{countEcTracks}}</span>
        <span>{{(countEcTracks > 1 ? 'Sentieri' : 'Sentiero')|wmtrans}}</span>
      </div>
    </ng-container>
    <ng-container *ngIf="layerFeaturesCount[layerId]?.pois as countEcPoi">
      <div
        *ngIf="countEcPoi > 0"
      >
        <span>{{countEcPoi}}</span>
        <span>{{(countEcPoi > 1 ? 'Punti di interesse' : 'Punto di interesse')|wmtrans}}</span>
      </div>
    </ng-container>
  </div>
</ng-container>
