<!-- Blocco «Il mio diario» (oc:8169): carosello sul cammino, elenco sulla tappa e nelle registrazioni. -->
<ng-container *ngIf="vm$ | async as vm">
  <section
    *ngIf="vm.visible"
    class="wm-diaries-section"
    [class.wm-diaries-section--list]="layout === 'list'"
  >
    <div class="wm-diaries-section-head">
      <h2 class="wm-diaries-section-title">{{ title | wmtrans }}</h2>
      <span class="wm-diaries-section-count" *ngIf="vm.list.length > 0">{{ vm.list.length }}</span>
    </div>

    <!-- senza dati freschi (rete assente o lettura fallita): avviso e «Riprova» sotto il titolo -->
    <div class="wm-diaries-section-notice" *ngIf="vm.notice as notice">
      <p class="wm-diaries-section-offline">{{ notice | wmtrans }}</p>
      <button type="button" class="wm-diaries-section-retry" (click)="retry()">
        {{ 'Riprova' | wmtrans }}
      </button>
    </div>

    <!-- diari scritti senza rete (oc:8169, ciclo 2): in attesa di invio o non inviati -->
    <ng-container *ngIf="queued$ | async as queued">
      <ul class="wm-diaries-section-outbox" *ngIf="queued.length > 0">
        <li *ngFor="let item of queued; trackBy: trackByUuid">
          <button
            type="button"
            class="wm-diaries-section-queued"
            [class.wm-diaries-section-queued--failed]="item.status === 'failed'"
            (click)="openQueued(item)"
          >
            <span class="wm-diaries-section-queued-state" role="status">
              <ion-icon
                [name]="item.status === 'failed' ? 'alert-circle-outline' : 'cloud-upload-outline'"
                aria-hidden="true"
              ></ion-icon>
              {{ (item.status === 'failed' ? 'Non inviato' : 'In attesa di invio') | wmtrans }}
            </span>
            <span class="wm-diaries-section-excerpt">{{ item.description }}</span>
          </button>
        </li>
      </ul>
    </ng-container>

    <!-- senza copia salvata: niente lista né scheda di creazione, solo l'avviso -->
    <ng-container *ngIf="!vm.unavailable">
      <ng-container *ngIf="layout === 'carousel'; else listLayout">
        <!-- vuoto o non loggato: solo la scheda larga -->
        <button
          type="button"
          *ngIf="vm.list.length === 0; else carousel"
          class="wm-diaries-section-create wm-diaries-section-create--wide"
          (click)="create()"
        >
          <span class="wm-diaries-section-create-icon" aria-hidden="true">
            <ion-icon name="add"></ion-icon>
          </span>
          <span class="wm-diaries-section-create-text">
            <span class="wm-diaries-section-create-title">{{ createLabel | wmtrans }}</span>
            <span class="wm-diaries-section-create-hint">{{
              'Un pensiero e fino a 6 foto su questo cammino.' | wmtrans
            }}</span>
          </span>
        </button>

        <ng-template #carousel>
          <wm-swiper class="wm-diaries-section-row" [options]="carouselOptions">
            <swiper-slide *ngIf="showCreate">
              <button
                type="button"
                class="wm-diaries-section-create wm-diaries-section-create--card"
                (click)="create()"
              >
                <ion-icon name="add" aria-hidden="true"></ion-icon>
                {{ createLabel | wmtrans }}
              </button>
            </swiper-slide>
            <swiper-slide *ngFor="let diary of vm.list; trackBy: trackById">
              <button
                type="button"
                class="wm-diaries-section-card"
                [class.wm-diaries-section-card--text]="!cover(diary)"
                (click)="open(diary)"
              >
                <!-- senza foto niente riquadro grigio: la scheda diventa di solo testo -->
                <span class="wm-diaries-section-card-photo" *ngIf="cover(diary) as src">
                  <img [src]="src" alt="" loading="lazy" (error)="onImgError($event)" />
                </span>
                <span class="wm-diaries-section-card-body">
                  <span
                    class="wm-diaries-section-label"
                    [class.wm-diaries-section-label--stage]="!!diary.ecTrack"
                  >{{ label(diary) }}</span>
                  <span class="wm-diaries-section-excerpt">{{ diary.description }}</span>
                </span>
              </button>
            </swiper-slide>
          </wm-swiper>
        </ng-template>
      </ng-container>

      <ng-template #listLayout>
        <button
          type="button"
          *ngFor="let diary of vm.list; trackBy: trackById"
          class="wm-diaries-section-item"
          [class.wm-diaries-section-item--text]="!cover(diary)"
          (click)="open(diary)"
        >
          <span class="wm-diaries-section-item-photo" *ngIf="cover(diary) as src">
            <img [src]="src" alt="" loading="lazy" (error)="onImgError($event)" />
          </span>
          <span class="wm-diaries-section-item-body">
            <span
              class="wm-diaries-section-label"
              [class.wm-diaries-section-label--stage]="ecTrackId == null && !!diary.ecTrack"
            >{{ meta(diary) }}</span>
            <span class="wm-diaries-section-excerpt">{{ diary.description }}</span>
          </span>
        </button>
        <button
          type="button"
          *ngIf="showCreate"
          class="wm-diaries-section-create wm-diaries-section-create--outline"
          (click)="create()"
        >
          <ion-icon name="add" aria-hidden="true"></ion-icon>
          {{ createLabel | wmtrans }}
        </button>
      </ng-template>
    </ng-container>
  </section>
</ng-container>
