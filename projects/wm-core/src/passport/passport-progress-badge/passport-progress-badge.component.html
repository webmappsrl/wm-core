<button
  *ngIf="vm$ | async as vm"
  type="button"
  class="wm-passport-progress-badge"
  (click)="openDetail()"
>
  <span class="wm-passport-progress-badge-percent">
    {{ '{{percent}}% completato' | wmtrans: {percent: vm.percent} }}
  </span>
  <span class="wm-passport-progress-badge-stages">
    {{ '{{completed}}/{{total}} tappe percorse · tocca per i dettagli' | wmtrans: {completed: vm.completed, total: vm.total} }}
  </span>
</button>
